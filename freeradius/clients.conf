# -*- text -*-
# =============================================================================
#  RADIUS PRO — clients.conf
#
#  Each "client" is a NAS (BNG / BRAS / MikroTik / etc.) allowed to send
#  RADIUS packets to this server. Secrets are read from the environment where
#  possible so nothing sensitive is committed to Git.
#
#  Future: NAS devices managed in the panel will be loaded from the SQL "nas"
#  table (sql { read_clients = yes }).
# =============================================================================

# -----------------------------------------------------------------------------
#  Development / test client — used by `radtest` inside the container.
#  testing123 is the well-known FreeRADIUS test secret. DEVELOPMENT ONLY.
# -----------------------------------------------------------------------------
client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = testing123
	# BlastRADIUS (CVE-2024-3596) protection — radtest 3.2.x sends Message-Authenticator
	require_message_authenticator = yes
	limit_proxy_state = yes
	nas_type = other
	shortname = localhost
	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = testing123
	require_message_authenticator = yes
	limit_proxy_state = yes
	shortname = localhost6
}

# -----------------------------------------------------------------------------
#  Internal Docker network — the RADIUS PRO backend (health checks, test tool)
# -----------------------------------------------------------------------------
client radius_panel_network {
	ipaddr = $ENV{RADIUS_CLIENT_NETWORK}
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = yes
	limit_proxy_state = yes
	shortname = radius-panel
	nas_type = other
}
